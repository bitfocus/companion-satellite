          kms-keyring: ${{ secrets.WINDOWS_CODESIGN_KMS_KEYRING }}
          kms-key: ${{ secrets.WINDOWS_CODESIGN_KMS_KEY }}
          certificate: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE }}

