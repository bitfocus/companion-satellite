name: Build/release

on:
  workflow_dispatch:

  push:

permissions: {}

env:
  API_PRODUCT: companion-satellite

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm libudev-dev libusb-1.0-0-dev

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Prepare
        run: |
          corepack enable

          # try and avoid timeout errors
          yarn config set httpTimeout 100000

          yarn

      - name: Lint
        run: |
          yarn lint

  Linux-x64:
    runs-on: ubuntu-22.04
    # A newer push to the same branch supersedes this build. Tag builds are never cancelled.
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-x64
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm libudev-dev libusb-1.0-0-dev

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Determine files to upload
        id: filenames
        shell: bash
        run: |
          HASH=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "sourcename=electron-output/companion-satellite-x64.tar.gz" >> $GITHUB_OUTPUT
          echo "targetname=companion-satellite-x64-${COUNT}-${HASH}.tar.gz" >> $GITHUB_OUTPUT
          echo "longversion=${VERSION}-${COUNT}+${HASH}" >> $GITHUB_OUTPUT

      - name: Run build
        run: |
          corepack enable

          # try and avoid timeout errors
          yarn config set httpTimeout 100000

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            export EB_UPDATE_CHANNEL=stable
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            export EB_UPDATE_CHANNEL=beta
            export BUILD_VERSION=${{ steps.filenames.outputs.longversion }}
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            export EB_UPDATE_CHANNEL=experimental
            export BUILD_VERSION=${{ steps.filenames.outputs.longversion }}
          fi

          yarn
          yarn --cwd webui install
          yarn dist

      - name: Upload build (beta)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && github.ref == 'refs/heads/main' }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.S3_HOST }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key: ${{ secrets.S3_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET }}

          api-version: ${{ steps.filenames.outputs.longversion }}
          api-branch: 'beta'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'linux-tgz'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}
      - name: Upload build (stable)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && startsWith(github.ref, 'refs/tags/') }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.RELEASE_S3_HOST }}
          s3-bucket: ${{ vars.RELEASE_S3_BUCKET }}/${{ env.API_PRODUCT }}
          s3-access-key: ${{ secrets.RELEASE_S3_KEY }}
          s3-secret-key: ${{ secrets.RELEASE_S3_SECRET }}

          public-bucket-url: ${{ vars.RELEASE_S3_URL }}/${{ env.API_PRODUCT }}

          api-version: ${{ github.ref_name }}
          api-branch: 'stable'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'linux-tgz'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}

      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: linux-x64
          path: ${{ steps.filenames.outputs.sourcename }}
          retention-days: 1

  Linux-arm64:
    runs-on: ubuntu-22.04-arm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-linux-arm64
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm libudev-dev libusb-1.0-0-dev

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Determine files to upload
        id: filenames
        shell: bash
        run: |
          HASH=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "sourcename=electron-output/companion-satellite-arm64.tar.gz" >> $GITHUB_OUTPUT
          echo "targetname=companion-satellite-arm64-${COUNT}-${HASH}.tar.gz" >> $GITHUB_OUTPUT
          echo "longversion=${VERSION}-${COUNT}+${HASH}" >> $GITHUB_OUTPUT

      - name: Run build
        run: |
          corepack enable

          # try and avoid timeout errors
          yarn config set httpTimeout 100000

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            export EB_UPDATE_CHANNEL=stable
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            export EB_UPDATE_CHANNEL=beta
            export BUILD_VERSION=${{ steps.filenames.outputs.longversion }}
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            export EB_UPDATE_CHANNEL=experimental
            export BUILD_VERSION=${{ steps.filenames.outputs.longversion }}
          fi

          yarn
          yarn --cwd webui install
          yarn dist linux-arm64

      - name: Upload build (beta)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && github.ref == 'refs/heads/main' }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.S3_HOST }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key: ${{ secrets.S3_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET }}

          api-version: ${{ steps.filenames.outputs.longversion }}
          api-branch: 'beta'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'linux-arm64-tgz'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}
      - name: Upload build (stable)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && startsWith(github.ref, 'refs/tags/') }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.RELEASE_S3_HOST }}
          s3-bucket: ${{ vars.RELEASE_S3_BUCKET }}/${{ env.API_PRODUCT }}
          s3-access-key: ${{ secrets.RELEASE_S3_KEY }}
          s3-secret-key: ${{ secrets.RELEASE_S3_SECRET }}

          public-bucket-url: ${{ vars.RELEASE_S3_URL }}/${{ env.API_PRODUCT }}

          api-version: ${{ github.ref_name }}
          api-branch: 'stable'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'linux-arm64-tgz'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}

      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: linux-arm64
          path: ${{ steps.filenames.outputs.sourcename }}
          retention-days: 1

  Windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-win32-x64
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

    env:
      # Sign the builds that are kept (main and release tags), or a push whose head commit message contains [build-signed]. Forks and Dependabot runs cannot get the signing secrets.
      SIGN_BUILD: ${{ github.repository == 'bitfocus/companion-satellite' && github.actor != 'dependabot[bot]' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build-signed]')) }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.node-version'

      - name: Determine files to upload
        id: filenames
        shell: bash
        run: |
          HASH=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "sourcename=electron-output/companion-satellite-x64.exe" >> $GITHUB_OUTPUT
          echo "targetname=companion-satellite-x64-${COUNT}-${HASH}.exe" >> $GITHUB_OUTPUT
          echo "longversion=${VERSION}-${COUNT}+${HASH}" >> $GITHUB_OUTPUT

      - name: Run build
        shell: bash
        run: |
          corepack enable

          # try and avoid timeout errors
          yarn config set httpTimeout 100000

          yarn
          yarn --cwd webui install

      - name: Setup code signing
        id: codesign
        if: ${{ env.SIGN_BUILD == 'true' }}
        uses: bitfocus/actions/setup-windows-codesign@main
        with:
          workload-identity-provider: ${{ secrets.WINDOWS_CODESIGN_WIF_PROVIDER }}
          service-account: ${{ secrets.WINDOWS_CODESIGN_SERVICE_ACCOUNT }}
          kms-keyring: ${{ secrets.WINDOWS_CODESIGN_KMS_KEYRING }}
          kms-key: ${{ secrets.WINDOWS_CODESIGN_KMS_KEY }}
          certificate: ${{ secrets.WINDOWS_CODESIGN_CERTIFICATE }}

      - name: build & package
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            export EB_UPDATE_CHANNEL=stable
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            export EB_UPDATE_CHANNEL=beta
            export BUILD_VERSION=${{ steps.filenames.outputs.longversion }}
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            export EB_UPDATE_CHANNEL=experimental
            export BUILD_VERSION=${{ steps.filenames.outputs.longversion }}
          fi

          yarn dist win32-x64
        env:
          CI: 1
          BF_CODESIGN_ACCESS_TOKEN: ${{ steps.codesign.outputs.access-token }}

      - name: Verify signature
        if: ${{ env.SIGN_BUILD == 'true' }}
        shell: pwsh
        run: |
          $Signature = Get-AuthenticodeSignature -LiteralPath ${{ steps.filenames.outputs.sourcename }}
          if ($Signature.Status -ne 'Valid') {
            throw "Installer signature is not valid: $($Signature.Status) $($Signature.StatusMessage)"
          }
          Write-Host "Installer signed by $($Signature.SignerCertificate.Subject)"

      - name: Upload build (beta)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && github.ref == 'refs/heads/main' }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.S3_HOST }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key: ${{ secrets.S3_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET }}

          api-version: ${{ steps.filenames.outputs.longversion }}
          api-branch: 'beta'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'win-x64'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}
      - name: Upload build (stable)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && startsWith(github.ref, 'refs/tags/') }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.RELEASE_S3_HOST }}
          s3-bucket: ${{ vars.RELEASE_S3_BUCKET }}/${{ env.API_PRODUCT }}
          s3-access-key: ${{ secrets.RELEASE_S3_KEY }}
          s3-secret-key: ${{ secrets.RELEASE_S3_SECRET }}

          public-bucket-url: ${{ vars.RELEASE_S3_URL }}/${{ env.API_PRODUCT }}

          api-version: ${{ github.ref_name }}
          api-branch: 'stable'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'win-x64'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}

      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: windows-x64
          path: ${{ steps.filenames.outputs.sourcename }}
          retention-days: 1

  Windows-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-win32-arm64
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

    env:
