        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && github.ref == 'refs/heads/main' }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.S3_HOST }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key: ${{ secrets.S3_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET }}

          api-version: ${{ steps.filenames.outputs.longversion }}
          api-branch: 'beta'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'mac-arm'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}
      - name: Upload build (stable)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && startsWith(github.ref, 'refs/tags/') }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.RELEASE_S3_HOST }}
          s3-bucket: ${{ vars.RELEASE_S3_BUCKET }}/${{ env.API_PRODUCT }}
          s3-access-key: ${{ secrets.RELEASE_S3_KEY }}
          s3-secret-key: ${{ secrets.RELEASE_S3_SECRET }}

          public-bucket-url: ${{ vars.RELEASE_S3_URL }}/${{ env.API_PRODUCT }}

          api-version: ${{ github.ref_name }}
          api-branch: 'stable'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'mac-arm'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}

      - name: Upload as artifact
        uses: actions/upload-artifact@v7
        with:
          archive: false
          name: mac-arm
          path: ${{ steps.filenames.outputs.sourcename }}
          retention-days: 1

  pi-img:
    runs-on: ubuntu-latest
    name: build image

    # only run for main
    if: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

    needs:
      - Linux-arm64

    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-pi-img
      cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine files to upload
        id: filenames
        shell: bash
        run: |
          HASH=$(git rev-parse --short HEAD)
          COUNT=$(git rev-list --count HEAD)
          VERSION=$(node -e "console.log(require('./package.json').version)")

          echo "sourcename=pi-image/output-satellitepi/image.xz" >> $GITHUB_OUTPUT
          echo "targetname=companion-satellite-pi-${COUNT}-${HASH}.img.xz" >> $GITHUB_OUTPUT
          echo "longversion=${VERSION}-${COUNT}+${HASH}" >> $GITHUB_OUTPUT
          echo "shortversion=v${VERSION}" >> $GITHUB_OUTPUT

      - name: install packer
        id: install-packer
        run: |
          curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo apt-key add -
          sudo apt-add-repository "deb [arch=amd64] https://apt.releases.hashicorp.com $(lsb_release -cs) main"
          sudo apt-get update && sudo apt-get install -y packer

          CACHE_KEY=$(grep iso_checksum pi-image/satellitepi.pkr.hcl)
          echo "CACHE_KEY=${CACHE_KEY}" >> "$GITHUB_OUTPUT"

      - name: Restore image cache
        uses: actions/cache@v6
        with:
          path: /tmp/packer_cache
          key: ${{ steps.install-packer.outputs.CACHE_KEY }}

      - name: build image
        run: |
          echo "BUILD_IS_TAG=${BUILD_IS_TAG}"
          if [[ "$BUILD_IS_TAG" == "true" ]]; then
            export BUILD_BRANCH=stable
            export BUILD_VERSION="${{ steps.filenames.outputs.shortversion }}"
          else
            export BUILD_BRANCH=${GITHUB_REF_NAME}
            export BUILD_VERSION="${{ steps.filenames.outputs.longversion }}"
          fi

          cd pi-image
          sudo packer init satellitepi.pkr.hcl
          sudo packer build --var branch=${BUILD_BRANCH} --var "build=$BUILD_VERSION" satellitepi.pkr.hcl
        env:
          PACKER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKER_CACHE_DIR: /tmp/packer_cache
          BUILD_IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: compress image
        shell: bash
        run: |
          cd pi-image/output-satellitepi

          sudo apt-get install -y zerofree
          device="$(sudo losetup --partscan --show --find image)"
          sudo zerofree "${device}p2"
          sudo losetup --detach "$device"

          sudo xz image

      - name: Upload build (beta)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && github.ref == 'refs/heads/main' }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.S3_HOST }}
          s3-bucket: ${{ vars.S3_BUCKET }}
          s3-access-key: ${{ secrets.S3_KEY }}
          s3-secret-key: ${{ secrets.S3_SECRET }}

          api-version: ${{ steps.filenames.outputs.longversion }}
          api-branch: 'beta'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'linux-img'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}
      - name: Upload build (stable)
        uses: bitfocus/actions/upload-and-notify-for-branch@main
        if: ${{ github.repository_owner == 'bitfocus' && startsWith(github.ref, 'refs/tags/') }}
        with:
          source-filename: ${{ steps.filenames.outputs.sourcename }}
          destination-filename: ${{ steps.filenames.outputs.targetname }}
          s3-host: ${{ vars.RELEASE_S3_HOST }}
          s3-bucket: ${{ vars.RELEASE_S3_BUCKET }}/${{ env.API_PRODUCT }}
          s3-access-key: ${{ secrets.RELEASE_S3_KEY }}
          s3-secret-key: ${{ secrets.RELEASE_S3_SECRET }}

          public-bucket-url: ${{ vars.RELEASE_S3_URL }}/${{ env.API_PRODUCT }}

          api-version: ${{ github.ref_name }}
          api-branch: 'stable'
          api-product: ${{ env.API_PRODUCT }}
          api-target: 'linux-img'
          api-secret: ${{ secrets.BITFOCUS_API_PROJECT_SECRET }}
